name: mobileluqman
description: "A new Flutter project."
publish_to: 'none' 
version: 0.1.0

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_staggered_grid_view: ^0.7.0
  intl: ^0.18.1
  sqflite: ^2.3.0
  path: ^1.9.0
  http: ^1.1.0
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
    uses-material-design: true
    assets:
    - images/  
    fonts:
     - family: JetBrainsMono
       fonts:
         - asset: font/JetBrainsMono-Light.ttf
        #  - asset: font/JetBrainsMono-Bold.ttf